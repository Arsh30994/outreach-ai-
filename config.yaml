# Edit the brand block: this is a PLACEHOLDER brand used for personalization.
brand:
  name: "YourBrand"
  product: "an AI-powered code review tool for developers"
  value_prop: "It helps developers catch bugs faster, and we'd give your audience an exclusive free trial."
  collaboration: "sponsored tutorial"
  compensation: "a flat-fee payment plus free product access"
  sender_name: "Alex"
  sender_email: "alex@yourbrand.example"
  postal_address: "YourBrand Inc., 123 Example Street, City, Country"

discovery:
  queries:
    - "artificial intelligence tutorial"
    - "machine learning for beginners"
    - "LLM developer tools"
    - "python programming tutorial"
    - "software engineering career"
    - "AI coding assistant"
    - "build AI apps"
    - "data science projects"
  max_results_per_query: 50
  pages_per_query: 1          # each page of search.list costs 100 quota units
  quota_budget: 9000          # stop before hitting the 10,000/day default
  min_followers: 5000
  max_followers: 100000
  recent_videos: 10
  cache_ttl_days: 7

filtering:
  niche_label: "Technology / AI"
  niche_terms:
    - "ai"
    - "artificial intelligence"
    - "machine learning"
    - "deep learning"
    - "llm"
    - "python"
    - "programming"
    - "coding"
    - "software engineering"
    - "developer"
    - "data science"
    - "automation"
  preferred_countries: []     # e.g. ["US", "IN", "GB"]; empty = no geography preference
  min_engagement: 1.0         # hard gate (percent)
  max_inactive_days: 90       # hard gate
  pass_score: 75
  review_score: 60

data:
  db_path: "data/outreach.db"
  export_dir: "data"
