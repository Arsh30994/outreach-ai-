# CreatorReach AI behaviour settings.
# Put API keys and OAuth paths in the environment (.env), never in this file.

brand:
  name: "YourBrand"
  product: "an AI-powered code review tool for developers"
  value_prop: "It helps developers catch bugs faster, and we'd give your audience an exclusive free trial."
  collaboration: "sponsored tutorial"
  compensation: "a flat-fee payment plus free product access"
  sender_name: "Alex"
  sender_email: "alex@yourbrand.example"
  postal_address: "YourBrand Inc., 123 Example Street, City, Country"

discovery:
  queries:
    - "artificial intelligence tutorial"
    - "machine learning for beginners"
    - "LLM developer tools"
    - "python programming tutorial"
    - "software engineering career"
    - "AI coding assistant"
    - "build AI apps"
    - "data science projects"
  max_results_per_query: 50
  pages_per_query: 1
  # Retained for the legacy root-level loader. The package reads quota.safety_budget.
  quota_budget: 9000
  min_followers: 5000
  max_followers: 100000
  recent_videos: 10
  cache_ttl_days: 7

filtering:
  niche_label: "Technology / AI"
  niche_terms:
    - "ai"
    - "artificial intelligence"
    - "machine learning"
    - "deep learning"
    - "llm"
    - "python"
    - "programming"
    - "coding"
    - "software engineering"
    - "developer"
    - "data science"
    - "automation"
  preferred_countries: []
  # Both names are accepted. minimum_engagement_rate and recent_upload_days win.
  min_engagement: 1.0
  minimum_engagement_rate: 1.0
  max_inactive_days: 90
  recent_upload_days: 90
  pass_score: 75
  review_score: 60

quota:
  # search.list is charged per request/page.
  search_list: 100
  channels_list: 1
  playlist_items_list: 1
  videos_list: 1
  daily_budget: 10000
  safety_budget: 9000
  safety_margin: 1000
  search_calls_per_day: 100

cache:
  ttl_days: 7

data:
  db_path: "data/outreach.db"
  export_dir: "data"
